name: Build FNF 0.8.4 APK
on:
  workflow_dispatch:
    inputs:
      build-defines:
        type: string
        description: Build defines
        default: '-DGITHUB_BUILD'
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILD_DEFINES: ${{ github.event.inputs.build-defines }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: false

      - name: Pull public assets & art
        run: |
          git clone --depth 1 https://github.com/FunkinCrew/Funkin.assets.git assets
          git clone --depth 1 https://github.com/FunkinCrew/Funkin.art.git art

      - name: Setup Haxe 4.2.5
        uses: HaxeFoundation/setup-haxe@v3
        with:
          haxe-version: "4.2.5"

      - name: Cache haxelib
        id: cache-hmm
        uses: actions/cache@v5
        with:
          path: .haxelib
          key: haxe-hmm-android-${{ hashFiles('**/hmm.json') }}

      - name: Install libs via hmm
        run: |
          haxelib newrepo
          haxelib run hmm install -q

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Release APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          haxelib run lime build android -v -release $BUILD_DEFINES

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnf‑vslice‑android
          path: export/android/bin/app-release-unsigned.apk
